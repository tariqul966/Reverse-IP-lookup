<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse IP Lookup Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <!-- Title & Subtitle -->
        <h1 class="text-3xl font-bold text-center text-emerald-400 mb-2">Reverse IP Lookup</h1>
        <p class="text-slate-400 text-center text-sm mb-6">
            Find all domains and A records associated with a given IP address.
        </p>

        <!-- Search Form -->
        <form id="lookupForm" class="flex flex-col sm:flex-row gap-3 mb-6">
            <input 
                type="text" 
                id="ipInput" 
                placeholder="Enter IP address or domain (e.g. 8.8.8.8)" 
                required
                class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
            />
            <button 
                type="submit" 
                id="submitBtn"
                class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-6 py-3 rounded-lg transition duration-200 flex items-center justify-center gap-2"
            >
                <span>Lookup</span>
            </button>
        </form>

        <!-- Status / Loading indicator -->
        <div id="status" class="hidden text-center py-3 text-slate-400 font-medium"></div>

        <!-- Result Output Box -->
        <div id="resultBox" class="hidden mt-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Results Found</h2>
                <button id="copyBtn" onclick="copyResults()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-300">Copy Results</button>
            </div>
            <pre id="output" class="bg-slate-950 p-4 rounded-lg border border-slate-800 text-emerald-300 font-mono text-sm max-h-80 overflow-y-auto whitespace-pre-wrap leading-relaxed"></pre>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const form = document.getElementById('lookupForm');
        const ipInput = document.getElementById('ipInput');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const output = document.getElementById('output');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = ipInput.value.trim();
            if (!query) return;

            // UI Reset
            status.classList.remove('hidden', 'text-red-400');
            status.classList.add('text-slate-400');
            status.textContent = 'Searching records... Please wait.';
            resultBox.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                // Using HackerTarget Free API
                const response = await fetch(`https://api.hackertarget.com/reverseiplookup/?q=${encodeURIComponent(query)}`);
                const data = await response.text();

                if (data.includes("API count exceed") || data.includes("error")) {
                    status.textContent = 'API limit exceeded or invalid input. Try again later.';
                    status.classList.add('text-red-400');
                } else if (data.trim() === "") {
                    status.textContent = 'No records found for this IP/Domain.';
                } else {
                    status.classList.add('hidden');
                    output.textContent = data;
                    resultBox.classList.remove('hidden');
                }
            } catch (err) {
                status.textContent = 'Failed to fetch data. Check your network connection.';
                status.classList.add('text-red-400');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function copyResults() {
            const text = output.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy Results', 2000);
            });
        }
    </script>
</body>
</html>
